services:
  - type: web
    name: kilimohub
    env: node
    region: frankfurt
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && NODE_ENV=production pnpm run build && pnpm exec tsx script/sync-schema.ts && pnpm exec tsx script/migrate.ts && pnpm exec tsx script/seed-modules.ts && pnpm exec tsx script/seed-admin.ts
    startCommand: pnpm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_APP_ID
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: OAUTH_SERVER_URL
        value: ""
      - key: OWNER_OPEN_ID
        sync: false
      - key: ADMIN_EMAIL
        value: admin@kilimohub.com
      - key: ADMIN_PASSWORD
        sync: false
